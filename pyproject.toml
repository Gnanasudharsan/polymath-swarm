[project]
name = "polymath"
version = "0.1.0"
description = "Verification-first multi-agent swarm for research and mathematics (LangGraph + MCP + A2A + Lean 4)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gnanasudharsan Ashokumar" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "litellm==1.108.0",
    "mcp==2.3.0",
    "openai==3.45.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "structlog==26.1.0",
    "sympy==1.14.0",
    "typer==0.27.3",
]

[project.scripts]
polymath = "polymath.cli:app"

[dependency-groups]
dev = [
    "fakeredis==2.40.0",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymath"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"evals/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["sympy", "sympy.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration and not live'"
filterwarnings = [
    # LiteLLM's TypedDicts use ReadOnly, which Pydantic warns about at import time.
    "ignore:.*ReadOnly.*qualifier:UserWarning",
]
markers = [
    "integration: needs Docker-backed services (run with -m integration)",
    "live: calls real paid LLM APIs (run with -m live)",
]
