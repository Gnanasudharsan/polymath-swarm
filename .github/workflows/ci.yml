name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  integration:
    name: Integration (docker compose)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cache local embedding/rerank models
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/polymath
          key: polymath-models-bge-small-v1.5-minilm-l6
      - run: docker compose up -d --wait
      - run: docker compose --profile tools build sandbox
      # Lean (multi-GB Mathlib image) runs in lean.yml; public-API tests are skipped
      # because shared runner IPs are rate-limited.
      - run: uv run pytest -m "integration and not lean and not network" -q
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  e2e:
    name: Frontend + e2e (Playwright, mock LLM)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: docker compose --profile tools build sandbox
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results
