name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  integration:
    name: Integration (docker compose)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: docker compose up -d --wait
      - run: docker compose --profile tools build sandbox
      # Lean (multi-GB Mathlib image) runs in lean.yml; public-API tests are skipped
      # because shared runner IPs are rate-limited.
      - run: uv run pytest -m "integration and not lean and not network" -q
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
